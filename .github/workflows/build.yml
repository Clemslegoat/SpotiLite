name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Tests
        run: cargo test --locked
      - name: Playback engine (WebView2 + Spotify SDK, memory of both profiles, informative)
        continue-on-error: true
        run: cargo test --locked -- --ignored --nocapture
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Build (release)
        run: cargo build --locked --release
      - name: Memory of SpotiLite (informative)
        continue-on-error: true
        shell: pwsh
        run: |
          $env:SPOTILITE_HOME = "$env:RUNNER_TEMP\spotilite-memory"
          $process = Start-Process -FilePath target/release/spotilite.exe -PassThru
          Start-Sleep -Seconds 15
          $counter = (Get-Counter "\Process(spotilite)\Working Set - Private").CounterSamples[0].CookedValue
          $process.Refresh()
          "SpotiLite (setup screen): private working set {0:N1} MB, private bytes {1:N1} MB, threads {2}" -f ($counter / 1MB), ($process.PrivateMemorySize64 / 1MB), $process.Threads.Count
          Stop-Process -Id $process.Id
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/spotilite.exe dist/SpotiLite.exe
          Copy-Item README.md, LICENSE dist/
          Compress-Archive -Path dist/* -DestinationPath SpotiLite-windows-x64.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: SpotiLite-windows-x64
          path: dist/
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: SpotiLite ${{ github.ref_name }}
          body_path: docs/release-notes.md
          files: |
            dist/SpotiLite.exe
            SpotiLite-windows-x64.zip
