<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>SpotiLite · moteur officiel</title>
<style>html,body{margin:0;background:#000;color:#777;font:12px system-ui,sans-serif}</style>
</head>
<body>
<!--
  Page invisible chargée par SpotiLite dans WebView2 : elle héberge le lecteur
  officiel de Spotify (Web Playback SDK). L'application lui envoie des commandes
  et reçoit ses événements par window.chrome.webview ; rien n'est affiché.
-->
<script>
"use strict";
const host = window.chrome && window.chrome.webview;
const send = (message) => { if (host) host.postMessage(message); };
const params = new URLSearchParams(location.search);
let volume = Math.min(1, Math.max(0, parseFloat(params.get("v"))));
if (Number.isNaN(volume)) volume = 0.7;
let player = null;
const waiting = [];

window.addEventListener("error", (e) => send({ type: "log", message: "js: " + String(e.message || e) }));

if (host) {
  host.addEventListener("message", (event) => {
    const m = event.data || {};
    switch (m.type) {
      case "token":
        for (const cb of waiting.splice(0)) {
          try { cb(m.token); } catch (e) { send({ type: "log", message: "token: " + e }); }
        }
        break;
      case "pause": if (player) player.pause(); break;
      case "resume": if (player) player.resume(); break;
      case "seek": if (player) player.seek(Math.max(0, m.ms | 0)); break;
      case "volume":
        volume = Math.min(1, Math.max(0, Number(m.value) || 0));
        if (player) player.setVolume(volume);
        break;
    }
  });
}

// Which DRM systems this WebView2 offers (Widevine is absent from WebView2;
// PlayReady, the DRM of Windows, is what Spotify's player falls back to).
const KEY_SYSTEMS = [
  "com.widevine.alpha",
  "com.microsoft.playready.recommendation.3000",
  "com.microsoft.playready.recommendation",
  "com.microsoft.playready.hardware",
  "com.microsoft.playready",
];
async function probeDrm() {
  const config = [{
    initDataTypes: ["cenc"],
    audioCapabilities: [{ contentType: 'audio/mp4; codecs="mp4a.40.2"' }],
  }];
  const found = [];
  for (const system of KEY_SYSTEMS) {
    try {
      if (navigator.requestMediaKeySystemAccess) {
        await navigator.requestMediaKeySystemAccess(system, config);
        found.push(system);
      }
    } catch (e) { /* not available */ }
  }
  send({ type: "drm", systems: found });
}
probeDrm();

function trackId(t) {
  if (!t) return null;
  if (t.linked_from && t.linked_from.id) return t.linked_from.id;
  if (t.id) return t.id;
  return (t.uri || "").split(":")[2] || null;
}

function report(state) {
  if (!state) { send({ type: "state", active: false }); return; }
  const current = state.track_window && state.track_window.current_track;
  send({
    type: "state",
    active: true,
    paused: !!state.paused,
    loading: !!state.loading,
    position: Math.max(0, state.position | 0),
    duration: Math.max(0, state.duration | 0),
    track: trackId(current),
  });
}

window.onSpotifyWebPlaybackSDKReady = () => {
  player = new Spotify.Player({
    name: "SpotiLite",
    volume,
    getOAuthToken: (cb) => { waiting.push(cb); send({ type: "need_token" }); },
  });
  player.addListener("ready", ({ device_id }) => send({ type: "ready", device_id }));
  player.addListener("not_ready", () => send({ type: "not_ready" }));
  player.addListener("player_state_changed", report);
  for (const kind of ["initialization_error", "authentication_error", "account_error", "playback_error"]) {
    player.addListener(kind, (e) => send({ type: "error", kind, message: String((e && e.message) || "") }));
  }
  player.addListener("autoplay_failed", () => send({ type: "error", kind: "autoplay_failed", message: "" }));
  player.connect().then((ok) => {
    if (!ok) send({ type: "error", kind: "connect", message: "connexion du lecteur refusée" });
  });
};
</script>
<script src="https://sdk.scdn.co/spotify-player.js"
        onerror="send({ type: 'error', kind: 'load', message: 'sdk.scdn.co injoignable' })"></script>
</body>
</html>
