[package]
name = "spotilite"
version = "0.2.0"
edition = "2024"
rust-version = "1.95"
description = "Client Spotify Premium natif et ultra léger pour Windows"
license = "MIT"
repository = "https://github.com/clemslegoat/SpotiLite"
readme = "README.md"
build = "build.rs"

[dependencies]
# Interface : egui en mode immédiat, dessinée par le processeur (rendu logiciel) :
# aucun pilote OpenGL/GPU n'est chargé dans le processus, la fenêtre est un simple
# tampon de pixels (softbuffer) affiché par Windows.
egui = { version = "0.36", default-features = false, features = ["default_fonts"] }
egui-winit = { version = "0.36", default-features = false, features = ["clipboard", "links", "x11"] }
winit = { version = "0.30", default-features = false, features = ["rwh_06", "x11"] }
softbuffer = { version = "0.4", default-features = false, features = ["x11", "x11-dlopen"] }
egui_software_backend = { path = "vendor/egui_software_backend" }
bytemuck = "1"
# Polices du système projetées en mémoire (partagées avec Windows, pas copiées).
memmap2 = "0.9"

# HTTP : reqwest 0.12 / hyper, TLS natif du système (SChannel sous Windows).
reqwest = { version = "0.12", default-features = false, features = ["native-tls"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
sha2 = "0.10"
base64 = "0.22"
rand = "0.9"
url = "2"
open = "5"

[target.'cfg(windows)'.dependencies]
# Touches multimédia et panneau média de Windows (System Media Transport Controls).
souvlaki = { version = "0.8", default-features = false }
raw-window-handle = "0.6"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
] }
# Lecture : WebView2, le moteur Edge intégré à Windows, héberge le lecteur officiel de
# Spotify. Le chargeur WebView2 est lié statiquement (aucune DLL à livrer).
webview2-com = "0.39"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
# Icône et informations de version de l'exécutable Windows (rc.exe ou windres).
winresource = { version = "0.1", default-features = false }

[workspace]
exclude = ["vendor"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true

[profile.dev.package."*"]
# Rendu logiciel utilisable même en build de debug.
opt-level = 2
